<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Sword Fighting</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="upperPart">
        <div class="header">
            <div class="playerHP"><span class="heart">&hearts;</span><span class="heart">&hearts;</span><span class="heart">&hearts;</span><span class="heart">&hearts;</span><br><p>Player HP</p></div>
            <div class="score">Score : 0</div>
            <div class="pause">Pause</div>
            <!-- <div class="timer">Timer : 1:00</div> -->
            <div class="enemyHP"><span class="heart">&hearts;</span><span class="heart">&hearts;</span><span class="heart">&hearts;</span><span class="heart">&hearts;</span><br><p>Enemy HP</p></div>
        </div>

        <div class="fightArea">
            <div class="player"><img src="assets/Player_Idle.svg"> </div>
            <div class="enemy"><img src="assets\Enemy_Idle (1).svg"></div>
        </div>
    </div>

    <div class="lowerPart">

        <div class="hud">
            <div class="left">&larr;</div>
            <div class="jump">&uarr;</div>
            <div class="right">&rarr;</div>
        </div>

        <div class="action">ATTACK</div>

    </div>

     <div class="result">
        <h1 class="resultText"></h1>
        <button class="restart">Restart</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
